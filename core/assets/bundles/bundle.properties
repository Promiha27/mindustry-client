resources-viewer-your-base = Your base

qol.feature.mine-defaults.title = Default Mining Ores
setting.qol-mine-defaults-enabled.name = Enable Default Mining Ores
setting.qol-mine-defaults-enabled.description = Units given the mine command (by you, or fresh out of a factory) automatically get your configured ore stances instead of vanilla's "mine everything" auto mode. You can still change a unit's ores manually afterwards - defaults apply only at the moment the command is given.
setting.qol-mine-defaults-configure.name = Configure default ores per unit type
qol.mine-defaults.dialog.title = Default mining ores
qol.mine-defaults.dialog.hint = Pick which ores each unit type should mine by default when it gets the mine command. Types with nothing selected are left on vanilla behavior. Manual stance changes on a unit are respected until it's given the mine command again.

qol.feature.core-heal.title = Core Auto-Heal
setting.qol-core-heal-enabled.name = Enable Core Auto-Heal
setting.qol-core-heal-enabled.description = Flying support units (poly, mega, ...) within the radius of a damaged core of yours drop what they're doing and heal it: far ones fly to the core first, then repair - including units you've commanded to repair, so they prioritize the core over random damaged walls. Previous commands are restored once the core has stayed at full health for the configured delay.
setting.coreheal-radius.name = Core heal radius
setting.coreheal-radius.description = How close (in tiles) a support unit must be to a damaged core for the auto-heal to kick in.
setting.coreheal-restore-delay.name = Return to previous command after
setting.coreheal-restore-delay.description = How many seconds the nearby core must stay at full health (taking no damage) before redirected units are sent back to their previous command. Prevents units ping-ponging between commands while the core is under repeated attack.
setting.minedefaults-distribute.name = Distribute miners across ores by core scarcity
setting.minedefaults-distribute.description = Instead of the whole fleet herding onto the single scarcest ore (vanilla behavior), configured miners are split between their configured ores proportionally to how scarce each is in the core: the scarcest gets the most units, the rest get fewer but at least one each. Rebalanced continuously; ores missing from the map or with full core storage get no units. Manually changing a unit's ores still takes it out of management until it's re-commanded. When off, the original behavior applies: each unit just gets the whole configured ore set once.
setting.minedefaults-flee.name = Miners flee from danger
setting.minedefaults-flee.description = A miner that an armed enemy unit closes in on, or that enters an enemy turret's range, drops mining and flies home to the nearest core; once it's been out of danger for a few seconds it goes back to mining on its own.
setting.minedefaults-flee-range.name = Enemy unit flee distance
setting.minedefaults-flee-range.description = How close (in tiles) an armed enemy unit must get before a miner runs. Turrets use their own range plus a small margin instead of this value.
setting.minedefaults-poly-split.name = Polys split: half mine, half assist you
setting.minedefaults-poly-split.description = When polys are put on the mine command, half of them are switched to assisting you with building instead (like the F9 hotkey), with the odd one staying on mining. The half/half balance is kept up as polys are built or lost; re-commanding an assisting poly yourself takes it out of the system.
setting.minedefaults-abundance-assist.name = Miners assist when their ores are abundant
setting.minedefaults-abundance-assist.description = A configured miner whose ENTIRE configured ore set is already near-full in the core (nothing worth mining right now) is switched to assisting you with building instead of idling. It's sent back to mining automatically once any of its ores drops low again. Re-commanding a diverted miner yourself takes it out of the system.
setting.minedefaults-abundance-high.name = Abundance assist: divert above
setting.minedefaults-abundance-high.description = Core storage percentage (for every one of a miner's configured ores) that counts as "abundant enough" to switch it to assisting instead of mining.
setting.minedefaults-abundance-low.name = Abundance assist: resume mining below
setting.minedefaults-abundance-low.description = Core storage percentage a diverted miner's ore has to drop back below before it resumes mining. Lower than the divert threshold on purpose, so it doesn't flip back and forth right at one boundary.
qol.feature.payload-drop.title = Emergency Payload Drop
setting.qol-payload-drop-enabled.name = Enable Emergency Payload Drop
setting.qol-payload-drop-enabled.description = A commandable carrier (mega, quad, oct, ...) that falls below the configured health while hauling cargo immediately unloads everything where it is, so the units aboard survive even if the carrier doesn't. Its previous command comes back once the hold is empty - except load/loop ferry commands, which would just re-pick-up the dumped cargo; those units simply stop. One emergency per low-health stretch: the unit isn't touched again until it has healed back above the threshold.
setting.payloaddrop-hp.name = Drop cargo below health
setting.payloaddrop-hp.description = Health percentage below which a loaded carrier performs its emergency unload.
qol.feature.assist-share.title = Assist Split
setting.qol-assist-share-enabled.name = Enable Assist Split
setting.qol-assist-share-enabled.description = With two or more builder players on the team, assist-commanded helpers are divided evenly between the players and each sticks to its own: while that player builds, the helper assists them, and between builds it parks at their side - instead of the whole swarm chasing whoever on the team touched a blueprint last, which is what vanilla assist does. Re-commanding a helper yourself takes it out of the system; with only one player present the feature stands down entirely. IMPORTANT: only one player on the team should have this enabled, or the two mods will fight over the same units.
setting.assistshare-idle-delay.name = Park helper after its player idles for
setting.assistshare-idle-delay.description = How many seconds after its player stops building a helper keeps assisting before parking at their side. It goes back to assisting the moment the player builds again.
qol.feature.travel-boost.title = Travel Boost
setting.qol-travel-boost-enabled.name = Enable Travel Boost
setting.qol-travel-boost-enabled.description = Mechs (pulsar, quasar, vela, ...) ordered to move farther than the configured distance take off (vanilla boost stance) for the trip and land on arrival. Attack orders are untouched - a boosted mech can't shoot. Only stances this feature enabled are ever cleared, a boost you set yourself is kept.
setting.travelboost-distance.name = Boost when moving farther than
setting.travelboost-distance.description = Move orders to a point at least this many tiles away make a mech fly there instead of walking.
qol.feature.conveyor-upgrade.title = Conveyor Mass Upgrade
setting.qol-conveyor-upgrade-enabled.name = Enable Conveyor Mass Upgrade
setting.qol-conveyor-upgrade-enabled.description = One hotkey (Controls -> Conveyor Mass Upgrade, default F7) queues replacing every plain conveyor your team owns with a titanium one, through your unit's normal build queue - costs, build speed and helpers all behave like hand-placed blocks. The queue is fed in batches, so the screen isn't flooded with thousands of ghosts. Press the key again to cancel. Armored conveyors are deliberately not offered: they refuse side input and would break layouts.
keybind.upgrade-conveyors.name = Upgrade all conveyors
category.conveyor-upgrade.name = Conveyor Mass Upgrade
qol.conveyor-upgrade.start = Conveyor upgrade: {0} queued
qol.conveyor-upgrade.none = No plain conveyors to upgrade
qol.conveyor-upgrade.cancel = Conveyor upgrade cancelled
qol.conveyor-upgrade.done = Conveyor upgrade finished
qol.feature.resource-forecast.title = Resource Forecast
setting.qol-resource-forecast-enabled.name = Enable Resource Forecast
setting.qol-resource-forecast-enabled.description = A HUD panel forecasting your own core's resources: per item the smoothed gain/drain rate and an ETA - "-> 0 0:45" for a draining item (most urgent first), "-> full 2:10" for a filling one. Spot silicon running out minutes before the OUT-OF toast.
qol.resource-forecast.quiet = No notable trends...
qol.feature.schematic-sanitizer.title = Schematic Sanitizer
setting.qol-schematic-sanitizer-enabled.name = Enable Schematic Sanitizer
setting.qol-schematic-sanitizer-enabled.description = Removes broken (null-block) tiles from schematics in your library - on game load and every time the schematics dialog opens. Such tiles are produced by buggy mods and hard-crash foo's client the moment the dialog is drawn. A toast names the cleaned schematics, which helps identify the mod that keeps producing them.
qol.schematic-sanitizer.cleaned = Schematic Sanitizer: removed {0} broken tile(s) from: {1}

qol.feature.quick-toggles.title = Quick Toggles
setting.qol-quick-toggles-enabled.name = Enable Quick Toggles
setting.qol-quick-toggles-enabled.description = Two draggable HUD buttons: camera-lock freezes your unit in place so you can pan the camera away from it freely, and build-pause is an on/off version of vanilla's hold-only "pause building" key.

qol.feature.auto-possess.title = Auto-Possess
setting.qol-auto-possess-enabled.name = Enable Auto-Possess
setting.qol-auto-possess-enabled.description = Automatically takes control of a unit the moment one becomes free: either a specific configured type, or the best-ranked type from a priority list if your current unit doesn't outrank it. Configure below.
setting.qol-auto-possess-configure.name = Configure Auto-Possess
