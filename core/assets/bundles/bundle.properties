qol.feature.bridge-to-core.title = Bridge To Core
bridgetocore-mode-bridge = Bridge mode
bridgetocore-mode-junction = Junction mode
bridgetocore-mode-titanium = Titanium conveyor mode
bridgetocore-titanium-build = Titanium build mode: replace manually placed titanium conveyor with sorters
bridgetocore-conveyor-build = Conveyor build mode: replace manually placed plain conveyor with sorters
bridgetocore-junction-build = Junction build mode: replace manually placed junctions with sorters at turns

setting.qol-bridge-to-core-enabled.name = Enable Bridge To Core
setting.bridgetocore-turn-aversion.name = Turn aversion
setting.bridgetocore-turn-aversion.description = How strongly the pathfinder avoids turns. Higher gives straighter routes with fewer bends (more likely to detour around obstacles instead); lower allows shorter, more turn-happy routes. 1x is the original untuned behavior.
setting.bridgetocore-no-turn-radius.name = No-turn radius near core
setting.bridgetocore-no-turn-radius.description = How far from the core (in tiles) the pathfinder starts strongly preferring a straight final approach over turning.
setting.bridgetocore-min-turn-distance.name = Minimum turn distance from core
setting.bridgetocore-min-turn-distance.description = The pathfinder's first attempt outright refuses to place a turn any closer to the core than this. If that's impossible given the obstacles, it automatically falls back to a route that may turn closer.
setting.bridgetocore-search-padding.name = Search padding
setting.bridgetocore-search-padding.description = How far past the start/end points (in tiles) the pathfinder is willing to search around obstacles. Higher handles bigger detours on cluttered bases but searches more tiles, so it's slower.
setting.bridgetocore-corner-penalty.name = Core corner penalty
setting.bridgetocore-corner-penalty.description = How strongly the pathfinder avoids approaching the core at a corner of its footprint instead of the middle of a side.
setting.bridgetocore-center-priority.name = Core center priority
setting.bridgetocore-center-priority.description = How strongly the pathfinder prefers an approach tile centered on the core's side over one nearer a corner, relative to how much extra travel distance that costs.

