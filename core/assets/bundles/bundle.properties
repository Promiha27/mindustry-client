qol.feature.auto-build-schematic.title = Auto Build Schematic
setting.qol-auto-build-schematic-enabled.name = Enable Auto Build Schematic
setting.qol-auto-build-schematic-enabled.description = Hold Shift and left-click while placing a schematic: queues its blocks into the team's shared rebuild queue and switches part of your currently assist-commanded helpers (scaled to the schematic's size, closest ones first) to the Rebuild command, so they build it on their own - no need to keep building yourself for helpers to keep working.
setting.autobuild-blocks-per-helper.name = Auto Build: blocks per helper sent
setting.autobuild-blocks-per-helper.description = How many schematic blocks justify sending one more helper - a small schematic pulls just one or two, a big one scales up to as many assist helpers as you have.
