qol.auto-build-schematic.dialog.title = Auto Build
qol.auto-build-schematic.dialog.hint = Which helper types get sent to auto-build first when a schematic/line is queued - slow types are good picks since they don't need to keep up with you, fast ones are better left on Assist. Types not listed rank last (stay on Assist longest).
